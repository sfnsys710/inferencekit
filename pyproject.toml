[project]
name = "ocrkit"
version = "0.5.0"
description = "OCR toolkit — traditional, LLM-based, and hybrid approaches applied to the Moroccan context"
readme = "README.md"
authors = [
    { name = "sfnsys710", email = "soufianenidam7@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fire>=0.7.1",
    "pillow>=10.0.0,<12.0.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "torch>=2.9.1",
    "torchvision>=0.24.1",
    "transformers>=4.57.3",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "matplotlib>=3.10.8",
    "pre-commit>=4.3.0",
]
api = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.18",
]
experiment = [
    "docling>=2.68.0",
    "pymupdf>=1.26.7",
    "python-doctr[viz]>=1.0.0",
    "tesserocr>=2.9.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "B008",  # FastAPI uses File() in function defaults
    "B904",  # Allow raising exceptions without from clause
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
